<title>صوتك مسموع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: رسمي دافئ — مدرسة تستمع لأسرة، بلا ضجيج بصري.
IDEA: لوحة إعلانات مدرسية أنيقة + مسار رحلة؛ كل صوت يصبح موجة ثم أثرًا.
PICTURE: مشهد مدرسة وبيت تتوسطهما فقاعة حوار تنبض بموجات صوتية.
COLOUR and TYPE: أخضر داكن مهيمن، أخضر هادئ مساند، ذهبي لمسات، أرضية عاجية؛ IBM Plex Sans Arabic ثم Tajawal.
LAYOUT: رأس ثابت بشريط تنقل قابل للتمرير، أشرطة كاملة العرض، محتوى حتى 1240px، عمود واحد للنماذج.
*/
:root{
  --fs:16px;
  --g9:#0b3d2e;--g8:#0f4c39;--g7:#135c45;--g5:#4f8f73;--g3:#a9cbb8;--g2:#dcebe2;--g1:#eef5f0;
  --gold:#a8822f;--gold2:#d8bd7f;--gold1:#f5ead0;
  --bg:#f7f2e7;--surf:#ffffff;--surf2:#fbf8f1;--line:#e3dac6;--ink:#13261f;--mut:#56665e;
  --red:#b3261e;--redbg:#fbe9e7;--amber:#8a5a00;--amberbg:#fdf0d5;--blue:#1d4f7a;--bluebg:#e5eef7;
  --hero:#0b3d2e;--heroink:#f7f2e7;
  --sh:0 1px 2px rgba(11,61,46,.06),0 6px 22px rgba(11,61,46,.07);
  --r:16px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --g9:#cfe6da;--g8:#bfe0cf;--g7:#8fd0b0;--g5:#6fb894;--g3:#2f5a49;--g2:#1c3a2f;--g1:#15291f;
  --gold:#e0c27f;--gold2:#a8822f;--gold1:#2b2516;
  --bg:#0c1813;--surf:#12221b;--surf2:#162a21;--line:#26402f;--ink:#e8f0eb;--mut:#a7b8ae;
  --red:#ff8a80;--redbg:#3a1714;--amber:#f2c46b;--amberbg:#33270f;--blue:#9cc4ea;--bluebg:#13263a;
  --hero:#081410;--heroink:#f2ecdf;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{font-size:var(--fs);scroll-padding-top:130px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Tajawal",system-ui,sans-serif;font-weight:400;font-size:1.0625rem;line-height:1.7;overflow-x:clip}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.3;text-wrap:balance;color:var(--g9)}
h1{font-size:clamp(2.25rem,5vw,3rem);font-weight:700;line-height:1.15}
h2{font-size:clamp(1.75rem,3.2vw,2rem);font-weight:700}
h3{font-size:clamp(1.25rem,2.2vw,1.5rem);font-weight:600}
h4{font-size:1.125rem;font-weight:600}
p{margin:0 0 .8em}
a{color:var(--g7)}
small,.small{font-size:.875rem;color:var(--mut)}
.mut{color:var(--mut)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.skip{position:absolute;top:0;inset-inline-start:8px;transform:translateY(-120%);z-index:99;background:var(--surf);padding:8px 12px;border-radius:8px}.skip:focus{transform:none}
input[type=file]{max-width:100%;font-size:.9375rem}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
.scroll{overflow-x:auto}

/* demo strip & header */
.demo{background:var(--gold1);color:var(--ink);font-size:.875rem;padding:6px max(5vw,16px);display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid var(--line)}
.demo button{background:none;border:0;text-decoration:underline;color:var(--g7);cursor:pointer;font-size:.875rem;padding:4px}
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px;padding:10px max(5vw,16px);max-width:1340px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--g9);flex:1 1 auto}
.brand b{font-size:1.25rem;font-weight:700;display:block;line-height:1.2}
.brand span{font-size:.875rem;color:var(--mut);display:block;line-height:1.3}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ib{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);display:inline-grid;place-items:center;cursor:pointer;position:relative;padding:0 10px;font-weight:500;font-size:1rem;color:var(--g9)}
.ib:hover{border-color:var(--g5)}
.ib .dot{position:absolute;top:6px;inset-inline-end:6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.75rem;display:grid;place-items:center;padding:0 4px;line-height:1}
.who{font-size:.875rem;color:var(--mut);white-space:nowrap}
nav.main{display:flex;gap:4px;padding:0 max(5vw,16px) 8px;max-width:1340px;margin:0 auto;overflow-x:auto;scrollbar-width:thin}
nav.main a{flex:none;text-decoration:none;color:var(--ink);font-weight:500;font-size:1rem;padding:8px 14px;border-radius:999px;white-space:nowrap}
nav.main a:hover{background:var(--g1)}
nav.main a[aria-current=page]{background:var(--g9);color:var(--bg)}
:root[data-theme=dark] nav.main a[aria-current=page]{background:var(--g7);color:#0c1813}
nav.main .sep{flex:none;width:1px;background:var(--line);margin:6px 6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;border:1px solid transparent;background:var(--g9);color:#f7f2e7;font-weight:500;font-size:1rem;cursor:pointer;text-decoration:none;line-height:1.3;transition:transform .15s,background .15s}
:root[data-theme=dark] .btn{background:var(--g7);color:#0c1813}
.btn:hover{transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:#fff}
:root[data-theme=dark] .btn.gold{color:#1b1406}
.btn.ghost{background:transparent;color:var(--g9);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--g5);background:var(--g1)}
.btn.sm{min-height:44px;padding:6px 14px;font-size:.9375rem}
.btn.danger{background:var(--red);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero */
.hero{background:var(--hero);color:var(--heroink);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 85% 20%,rgba(216,189,127,.18),transparent 55%),radial-gradient(ellipse at 10% 90%,rgba(79,143,115,.35),transparent 60%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.hero h1{color:#fff;font-size:clamp(2.25rem,6vw,3rem);margin-bottom:.15em}
.hero .slogan{color:var(--gold2);font-size:clamp(1.125rem,2.4vw,1.375rem);font-weight:600;margin-bottom:.8em}
.hero blockquote{margin:0 0 1.4em;font-size:1.0625rem;line-height:1.85;color:#e6efe9;border-inline-start:3px solid var(--gold2);padding-inline-start:14px;max-width:60ch}
.cta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cta button{min-height:76px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:500;font-size:.9375rem;padding:10px 6px;text-align:center;line-height:1.35;transition:background .2s,transform .2s}
.cta button:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.cta button.pri{background:var(--gold);border-color:var(--gold)}
.cta svg{width:24px;height:24px}
.scene{width:100%;aspect-ratio:560/430;display:block}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 1.4s ease-in-out infinite}
@keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}

/* stage strip */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.stages div{padding:18px 14px;text-align:center;position:relative;border-inline-start:1px solid var(--line)}
.stages div:first-child{border:0}
.stages b{display:block;font-size:1.125rem;color:var(--g9);font-weight:600}
.stages span{font-size:.875rem;color:var(--mut)}
.stages i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 6px;border-radius:50%;background:var(--g1);color:var(--g7);font-style:normal}

/* cards & grids */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card h3,.card h4{margin-bottom:.3em}
.card.flat{box-shadow:none}
.ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--g1);color:var(--g7);margin-bottom:10px}
.ico svg{width:26px;height:26px}
.why .card:nth-child(2) .ico{background:var(--gold1);color:var(--gold)}
.why .card:nth-child(4) .ico{background:var(--gold1);color:var(--gold)}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.sechead p{margin:0;color:var(--mut);max-width:62ch}
.kicker{color:var(--gold);font-weight:600;font-size:.9375rem;margin-bottom:4px;display:block}

/* stats */
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat b{display:block;font-size:clamp(1.75rem,3.4vw,2.25rem);font-weight:700;color:var(--g9);line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:.9375rem;color:var(--mut)}
.stat.na b{font-size:1rem;font-weight:500;color:var(--mut);padding:10px 0}
.stat.warn b{color:var(--red)}

/* forms */
form.f{display:grid;gap:18px;max-width:760px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0;background:var(--surf);display:grid;gap:14px}
legend{font-weight:600;font-size:1.125rem;color:var(--g9);padding:0 8px}
label.l{display:grid;gap:6px;font-weight:500}
label.l>span{font-size:1rem}
.req::after{content:" *";color:var(--red)}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surf2);padding:10px 14px;font-size:1rem;font-weight:400}
textarea{min-height:130px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--g5);outline:2px solid color-mix(in srgb,var(--g5) 35%,transparent)}
.hint{font-size:.875rem;color:var(--mut);font-weight:400}
.err{font-size:.875rem;color:var(--red);font-weight:500}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:4px;accent-color:var(--g7);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surf2);font-weight:500;font-size:.9375rem}
.chips input:checked+span{background:var(--g9);color:var(--bg);border-color:var(--g9)}
:root[data-theme=dark] .chips input:checked+span{background:var(--g7);color:#0c1813}
.chips input:focus-visible+span{outline:3px solid var(--gold)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.notice{border-radius:12px;padding:12px 14px;font-size:.9375rem;display:flex;gap:10px;align-items:flex-start;background:var(--bluebg);color:var(--blue)}
.notice.warn{background:var(--amberbg);color:var(--amber)}
.notice.red{background:var(--redbg);color:var(--red)}
.notice.ok{background:var(--g1);color:var(--g7)}
.notice svg{flex:none;width:22px;height:22px;margin-top:2px}

/* voice */
.voice{border:1px dashed var(--g5);border-radius:var(--r);padding:16px;background:var(--g1);display:grid;gap:12px}
.vcanvas{width:100%;height:84px;display:block;border-radius:10px;background:var(--surf)}
.rec{width:64px;height:64px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center}
.rec.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,38,30,.5)}100%{box-shadow:0 0 0 18px rgba(179,38,30,0)}}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:1.25rem}
audio{width:100%;max-width:100%}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;position:relative;padding-bottom:18px}
.tl li::before{content:"";position:absolute;inset-inline-start:25px;top:48px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--g5)}
.tl .n{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surf2);border:2px solid var(--line);color:var(--mut)}
.tl .n svg{width:24px;height:24px}
.tl li.done .n{background:var(--g7);border-color:var(--g7);color:#fff}
.tl li.cur .n{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 0 6px var(--gold1)}
.tl b{display:block;font-weight:600;font-size:1.0625rem;padding-top:4px}
.tl small{display:block}
.reply{background:var(--surf2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}

/* badges */
.bd{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8125rem;font-weight:500;white-space:nowrap;background:var(--g1);color:var(--g7);line-height:1.8}
.bd.s0{background:var(--bluebg);color:var(--blue)}
.bd.s1,.bd.s2{background:var(--amberbg);color:var(--amber)}
.bd.s3{background:var(--gold1);color:var(--gold)}
.bd.s4,.bd.s5,.bd.s6{background:var(--g1);color:var(--g7)}
.bd.red{background:var(--redbg);color:var(--red)}
.bd.gray{background:var(--surf2);color:var(--mut);border:1px solid var(--line)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:.9375rem}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:.875rem;white-space:nowrap;background:var(--surf2)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--g1)}
td.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablebox{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:.9375rem}
.bar .t{height:14px;border-radius:7px;background:var(--g1);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:7px;background:var(--g5);transition:width .6s}
.bar .t i.gd{background:var(--gold)}
.bar .v{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px;border-bottom:1px solid var(--line)}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.8125rem}
.cols i{display:block;width:100%;max-width:46px;background:var(--g5);border-radius:8px 8px 0 0;min-height:2px}
.collab{display:flex;gap:8px}.collab span{flex:1;text-align:center;font-size:.8125rem;color:var(--mut)}

/* filters */
.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.filters label{font-size:.875rem;display:grid;gap:4px;color:var(--mut)}
.subnav{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:18px;padding-bottom:4px}
.subnav a{flex:none;text-decoration:none;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-weight:500;font-size:.9375rem;white-space:nowrap}
.subnav a[aria-current=page]{border-color:var(--g7);background:var(--g1);color:var(--g7)}

/* modal / drawer */
.ov{position:fixed;inset:0;background:rgba(5,20,15,.5);z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:4vh 12px;overflow-y:auto}
.modal{background:var(--bg);border-radius:20px;width:min(860px,100%);padding:clamp(18px,3vw,28px);box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
.modal .x{position:absolute;top:12px;inset-inline-end:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--g9);color:var(--bg);padding:12px 20px;border-radius:12px;z-index:99;box-shadow:var(--sh);max-width:calc(100vw - 32px);font-weight:500}
:root[data-theme=dark] .toast{background:var(--g7);color:#0c1813}

/* rafiq */
.rq-btn{position:fixed;bottom:18px;inset-inline-end:18px;z-index:60;height:56px;border-radius:28px;padding:0 18px 0 14px;border:0;background:var(--gold);color:#fff;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:1rem}
.rq{position:fixed;bottom:84px;inset-inline-end:18px;z-index:61;width:min(380px,calc(100vw - 24px));max-height:min(560px,70vh);background:var(--surf);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.rq header{background:var(--g9);color:#f7f2e7;padding:12px 16px}
:root[data-theme=dark] .rq header{background:var(--g2)}
.rq header b{display:block}.rq header small{color:#cfe0d6}
.rq .msgs{flex:1;overflow-y:auto;padding:12px;display:grid;gap:8px;align-content:start}
.m{padding:10px 12px;border-radius:14px;font-size:.9375rem;max-width:88%;line-height:1.6}
.m.b{background:var(--g1);justify-self:start}
.m.u{background:var(--gold1);justify-self:end}
.rq form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.rq form input{min-height:44px}

/* paper (reports, certificates) */
.paper{background:#fff;color:#13261f;width:100%;max-width:794px;margin:0 auto;padding:40px 44px;border:1px solid #e3dac6;border-radius:6px;box-shadow:var(--sh);font-size:15px}
.paper h1,.paper h2,.paper h3{color:#0b3d2e}
.paper table th{background:#f3efe5;color:#56665e}
.paper td,.paper th{border-color:#e3dac6}
.cert{border:10px double #a8822f;padding:40px;text-align:center}

/* story */
.story{display:grid;gap:10px}
.story .ph{height:140px;border-radius:12px;background:linear-gradient(135deg,var(--g2),var(--gold1));display:grid;place-items:center;color:var(--g7);font-size:.875rem;overflow:hidden}
.story .ph img{width:100%;height:100%;object-fit:cover}
.kv{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr);gap:4px 12px;font-size:.9375rem;margin:0}
.kv dt{color:var(--mut)}.kv dd{margin:0}

/* footer */
footer.ft{background:var(--hero);color:#dfe9e3;margin-top:40px}
footer.ft .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:28px}
footer.ft b{color:#fff}
footer.ft a{color:var(--gold2)}
footer.ft .closing{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.14);padding-top:18px;text-align:center;font-size:1.0625rem;color:var(--gold2)}
.emg{background:var(--redbg);color:var(--red);padding:10px max(5vw,16px);font-size:.9375rem;text-align:center}

.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}
.empty{padding:28px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:var(--r)}
.stars{display:flex;gap:4px;direction:ltr;justify-content:flex-end}
.stars button{width:44px;height:44px;border:0;background:none;cursor:pointer;color:var(--line);padding:0}
.stars button.on{color:var(--gold)}
.stars svg{width:32px;height:32px}
.qr{display:grid;place-items:center;background:#fff;padding:18px;border-radius:12px;width:max-content;margin:0 auto}
.pill{display:inline-block;background:var(--g1);color:var(--g7);border-radius:8px;padding:2px 8px;font-size:.8125rem;margin:2px}
.copy{font-family:ui-monospace,monospace;font-size:1.25rem;letter-spacing:.04em;background:var(--surf2);border:1px dashed var(--g5);border-radius:10px;padding:8px 14px;direction:ltr;display:inline-block}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}

@media (max-width:960px){
  .hero .wrap{grid-template-columns:minmax(0,1fr)}
  .scene{max-width:520px;margin:0 auto;order:-1}
  .g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:repeat(3,minmax(0,1fr))}
  footer.ft .wrap{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .cta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3,.two{grid-template-columns:minmax(0,1fr)}
  .stages{grid-template-columns:minmax(0,1fr)}
  .stages div{border-inline-start:0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;text-align:start}
  .stages i{margin:0}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 3em}
  .brand span{display:none}
  .who{display:none}
  .rq-btn{width:56px;padding:0;justify-content:center;font-size:0;gap:0}
  .rq{bottom:84px}
  .paper{padding:20px 16px}
  table{font-size:13px}
  .stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
  .stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}
  .stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);white-space:normal}
  .stack td:empty{display:none}
  .stack td.num{text-align:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
@media print{header.top,.demo,nav,.rq-btn,.rq,footer.ft,.noprint{display:none!important}body{background:#fff}.paper{box-shadow:none;border:0}}

const MIN=3;
function inScope(s,f=S.f){
 if(f.year!=='all'&&String(s.year)!==String(f.year))return false;
 if(f.term!=='all'&&String(s.term)!==String(f.term))return false;
 if(f.period!=='all'&&days(s.createdAt,Date.now())>+f.period)return false;
 if(f.type&&f.type!=='all'&&s.type!==f.type)return false;
 if(f.status&&f.status!=='all'&&String(s.status)!==f.status)return false;
 if(f.assignee&&f.assignee!=='all'&&s.assignee!==f.assignee)return false;
 return true;
}
function kpis(f={...S.f,type:'all',status:'all',assignee:'all'}){
 const subs=mine(DB.subs).filter(s=>inScope(s,f));const sc=SC();
 const tot=subs.length,resp=subs.filter(s=>s.status>=4);
 const sug=subs.filter(s=>s.type==='suggest'),appr=sug.filter(s=>s.approved),impl=sug.filter(s=>s.implemented);
 const rated=subs.filter(s=>s.rating),pos=rated.filter(s=>s.rating>=4);
 const fam=new Set(subs.filter(s=>s.parent).map(s=>s.parent));
 mine(DB.regs.map(r=>({...r,school:(DB.inits.find(i=>i.id===r.init)||{}).school}))).forEach(r=>fam.add(r.user));
 const rt=subs.filter(s=>s.firstResponseAt).map(s=>days(s.createdAt,s.firstResponseAt));
 const ct=subs.filter(s=>s.closedAt).map(s=>days(s.createdAt,s.closedAt));
 const closed=subs.filter(s=>s.closedAt),within=closed.filter(s=>days(s.createdAt,s.closedAt)<=s.dueDays);
 const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
 const sAvg=id=>{const r=DB.responses.filter(x=>x.survey===id);const v=r.flatMap(x=>Object.values(x.answers).filter(a=>typeof a==='number'));return v.length>=MIN?avg(v):null};
 const pres=mine(DB.surveys).filter(s=>s.kind==='pre');let impr=null,preA=null,postA=null;
 if(pres.length){const pv=[],qv=[];pres.forEach(p=>{const post=mine(DB.surveys).find(s=>s.kind==='post'&&s.title.split('—')[1]?.trim()===p.title.split('—')[1]?.trim());const a=sAvg(p.id),b=post&&sAvg(post.id);if(a!=null&&b!=null){pv.push(a);qv.push(b)}});if(pv.length){preA=avg(pv);postA=avg(qv);impr=(postA-preA)/preA*100}}
 const overdue=subs.filter(s=>s.status<5&&days(s.createdAt,Date.now())>s.dueDays&&s.status>0||s.status===0&&days(s.createdAt,Date.now())>2);
 const dc={};subs.forEach(s=>dc[s.domain]=(dc[s.domain]||0)+1);
 return{subs,tot,newC:subs.filter(s=>s.status===0).length,prog:subs.filter(s=>s.status>=1&&s.status<=3).length,done:subs.filter(s=>s.status>=4).length,overdue,
  resp:tot>=MIN?pct(resp.length,tot):null,respN:[resp.length,tot],
  impl:appr.length>=1&&sug.length>=MIN?pct(impl.length,appr.length):null,implN:[impl.length,appr.length],implC:impl.length,
  sat:rated.length>=MIN?pct(pos.length,rated.length):null,satN:[pos.length,rated.length],
  part:sc.targetFamilies?pct(fam.size,sc.targetFamilies):null,partN:[fam.size,sc.targetFamilies],
  avg:rt.length>=MIN?avg(rt):null,avgN:rt.length,close:ct.length>=MIN?avg(ct):null,
  within:closed.length>=MIN?pct(within.length,closed.length):null,withinN:[within.length,closed.length],
  impr,preA,postA,dc,inits:mine(DB.inits).length,meet:mine(DB.appts).filter(a=>a.status!=='cancelled').length};
}

/* ===== رحلة صوتك ===== */
function journey(s,full=true){
 const sc=SC(),last=s.history[s.history.length-1];
 const canRate=S.user?.role!=='vice'&&s.status>=4&&!s.rating;
 const canReopen=s.status>=5&&s.rating&&s.rating<=2&&s.reopened<1&&s.closedAt&&days(s.closedAt,Date.now())<=sc.reopenDays;
 return `<div class="card" id="j-${s.id}"><div class="sechead" style="margin-bottom:10px"><div><span class="small" dir="ltr">${esc(s.ref)}</span><h3 style="margin:0">${esc(s.title)}</h3><div class="row" style="gap:6px;margin-top:6px"><span class="bd gray">${TYPE[s.type]}</span><span class="bd gray">${esc(s.domain)}</span>${stBadge(s)}${s.reopened?'<span class="bd red">أعيد فتحها</span>':''}</div></div><p class="small">آخر تحديث: ${fdt(s.updatedAt)}</p></div>
 ${full?`<ol class="tl">${STAGES.map(([t,i],k)=>{const h=[...s.history].reverse().find(x=>x.st===k);const done=k<s.status||(k===s.status&&(k===6||k===5&&s.rating));const cur=k===s.status&&!done;return`<li class="${done?'done':''} ${cur?'cur':''}"><span class="n">${ic(i)}</span><div><b>${t}</b><small>${h?fdt(h.at):cur?'المرحلة الحالية':'لم تبدأ بعد'}</small>${k===4?s.replies.filter(r=>r.public).map(r=>`<div class="reply"><small>رد ${esc(ROLE[r.by]||'المدرسة')} — ${fdt(r.at)}</small>${esc(r.text)}</div>`).join(''):''}${k===6&&s.rating?`<div class="reply">تقييمك: ${'★'.repeat(s.rating)}${'☆'.repeat(5-s.rating)}${s.ratingNote?' — '+esc(s.ratingNote):''}</div>`:''}</div></li>`}).join('')}</ol>`:''}
 ${canRate?`<hr><h4>قيّم جودة الاستجابة</h4><div class="stars" id="stars-${s.id}" role="radiogroup" aria-label="التقييم من 1 إلى 5">${[5,4,3,2,1].map(v=>`<button type="button" data-act="star" data-id="${s.id}" data-v="${v}" aria-label="${v} من 5">${ic('star',32,true)}</button>`).join('')}</div><label class="l"><span>ملاحظة (اختياري)</span><textarea id="rn-${s.id}" style="min-height:70px"></textarea></label><button class="btn sm" data-act="rateSend" data-id="${s.id}">إرسال التقييم</button>`:''}
 ${canReopen?`<hr><div class="notice warn">${ic('info')}<div>لم تكن راضيًا عن المعالجة؟ يمكنك طلب إعادة فتح المشاركة مرة واحدة خلال ${sc.reopenDays} أيام من إغلاقها.</div></div><label class="l"><span class="req">سبب طلب إعادة الفتح</span><textarea id="ro-${s.id}" style="min-height:70px"></textarea></label><button class="btn ghost sm" data-act="reopen" data-id="${s.id}">طلب إعادة الفتح</button>`:''}
 </div>`;
}

function setStatus(s,st,note){
 st=+st;if(st===s.status)return;
 s.status=st;s.updatedAt=new Date().toISOString();s.history.push({st,at:s.updatedAt,note});
 if(st>=4&&!s.firstResponseAt)s.firstResponseAt=s.updatedAt;
 if(st===5)s.closedAt=s.updatedAt;
 if(st<5)s.closedAt=null;
 if(s.parent)notify(s.parent,`تحديث على مشاركتك ${s.ref}: ${STAGES[st][0]}.`);
 audit('تحديث حالة: '+STAGES[st][0],s.ref);
}

function kpiRows(k,sc){

 ['avg','متوسط زمن الاستجابة','متوسط الأيام من الاستلام حتى أول استجابة (الأقل أفضل)',k.avg,' يوم',null],
 ['within','نسبة الطلبات المعالجة ضمن المدة المستهدفة','المشاركات المغلقة ضمن مدتها ÷ المشاركات المغلقة × 100',k.within,'%',k.withinN],
 ['impr','نسبة التحسن بين القياس القبلي والبعدي','(متوسط البعدي − متوسط القبلي) ÷ متوسط القبلي × 100',k.impr,'%',k.preA!=null?[n1(k.postA),n1(k.preA)]:null]];

const RTYPES=[['weekly','التقرير الأسبوعي'],['monthly','التقرير الشهري'],['term','تقرير الفصل الدراسي'],['annual','التقرير السنوي'],['sat','تقرير رضا المستفيدين'],['partner','تقرير الشراكة الأسرية'],['impl','تقرير المقترحات المنفذة'],['inits','تقرير المبادرات والشواهد'],['final','التقرير الختامي وقياس الأثر']];
function recs(k,sc){const r=[];const t=sc.targets;
 if(k.resp!=null&&k.resp<t.resp)r.push('رفع نسبة الاستجابة بتحديد مسؤولة متابعة يومية للمشاركات الجديدة.');
 if(k.overdue.length)r.push(`معالجة ${k.overdue.length} مشاركة متأخرة عن مدتها المستهدفة وتحليل أسباب التأخر.`);
 if(k.sat!=null&&k.sat<t.sat)r.push('مراجعة المشاركات منخفضة التقييم وإعادة التواصل مع أصحابها.');
 if(k.part!=null&&k.part<t.part)r.push('توسيع المشاركة الأسرية عبر باركود المشاركة ورسائل التوعية في اللقاءات.');
 if(k.impl!=null&&k.impl<t.impl)r.push('وضع خطة زمنية لتنفيذ المقترحات المعتمدة المتبقية.');
 if(!r.length)r.push('الاستمرار على المستوى الحالي وتوثيق الممارسات الناجحة ونشرها في «من صوت إلى أثر».');
 if([k.resp,k.sat,k.impl,k.within].some(v=>v==null))r.push('جمع بيانات إضافية؛ بعض المؤشرات لم تبلغ الحد الأدنى للحساب.');
 return r}

 if(['impl','final','term','annual'].includes(type))body+=`<h3>المقترحات المنفذة</h3>${T(['المرجع','المقترح','المجال','تاريخ الإغلاق'],impl.map(s=>[`<span dir="ltr">${esc(s.ref)}</span>`,esc(s.title),esc(s.domain),fd(s.closedAt)]))}`;

 if(type==='final')body+=`<h3>القياس القبلي والبعدي</h3>${k.impr==null?'<p>لا توجد بيانات كافية</p>':T(['متوسط القبلي','متوسط البعدي','نسبة التحسن'],[[n1(k.preA),n1(k.postA),n1(k.impr)+'%']])}<h3>قصص الأثر</h3>${T(['القصة','الإجراء','المستفيدون'],st.map(s=>[esc(s.title),esc(s.action),s.benef]))}`;

 S.sent=S.sent.filter(t=>Date.now()-t<600000);if(S.sent.length>=3)return E('وصلت إلى الحد المسموح (3 مشاركات خلال 10 دقائق). حاول لاحقًا.');

let REC=null;
function sizeCanvas(){const c=$('#vCanvas');if(c){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;idleWave(c)}}
function idleWave(c){const x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--g3');for(let i=0;i<w;i+=8*devicePixelRatio)x.fillRect(i,h/2-1,4*devicePixelRatio,2)}
function drawBars(c,vals){const x=c.getContext('2d'),w=c.width,h=c.height,n=vals.length,bw=w/n;x.clearRect(0,0,w,h);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--g5');vals.forEach((v,i)=>{const bh=Math.max(2,v*h*.9);x.fillRect(i*bw+bw*.2,(h-bh)/2,bw*.6,bh)})}
const mmss=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
async function startRec(){
 if(REC)return stopRec();
 const st=$('#vState');
 try{
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)throw new Error('unsupported');
  st.textContent='بانتظار إذن الميكروفون…';
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mr=new MediaRecorder(stream),chunks=[],ac=new (window.AudioContext||window.webkitAudioContext)(),an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(stream).connect(an);
  const t0=Date.now();REC={mr,stream,ac,an,t0};
  mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  mr.onstop=()=>{const dur=(Date.now()-t0)/1000;stream.getTracks().forEach(t=>t.stop());ac.close();cancelAnimationFrame(REC?.raf);REC=null;setVoice(new Blob(chunks,{type:mr.mimeType||'audio/webm'}),dur)};
  mr.start();$('#recBtn').classList.add('on');$('#recBtn').innerHTML=ic('stop',26);$('#recBtn').setAttribute('aria-label','إيقاف التسجيل');st.textContent='جارٍ التسجيل… اضغط للإيقاف';
  const c=$('#vCanvas'),buf=new Uint8Array(an.frequencyBinCount);
  const loop=()=>{if(!REC)return;an.getByteTimeDomainData(buf);const v=[];for(let i=0;i<48;i++){let m=0;for(let j=0;j<buf.length/48;j++)m=Math.max(m,Math.abs(buf[Math.floor(i*buf.length/48)+j]-128));v.push(m/128)}c&&drawBars(c,v);const s=(Date.now()-t0)/1000;$('#vTimer')&&($('#vTimer').textContent=mmss(s));if(s>=180)stopRec();else REC.raf=requestAnimationFrame(loop)};loop();
 }catch(e){
  st.textContent='';$('#vFallback').hidden=false;
  $('#vFbMsg').textContent=e?.name==='NotAllowedError'?'لم يُمنح إذن الميكروفون، أو لا يسمح هذا العرض باستخدامه.':'هذا المتصفح أو العرض لا يدعم التسجيل المباشر.';
 }
}
function stopRec(){if(REC&&REC.mr.state!=='inactive')REC.mr.stop();const b=$('#recBtn');if(b){b.classList.remove('on');b.innerHTML=ic('mic',28);b.setAttribute('aria-label','بدء التسجيل')}}
function setVoice(blob,dur){if(S.voice.url)URL.revokeObjectURL(S.voice.url);S.voice={blob,url:URL.createObjectURL(blob),dur};showVoice()}
function showVoice(){
 const p=$('#vPlay');if(!p)return;const v=S.voice;
 $('#vState').textContent='تم التسجيل — استمع إليه قبل الإرسال';$('#vTimer').textContent=mmss(v.dur||0);
 p.innerHTML=`<audio controls src="${v.url}"></audio><div class="row" style="margin-top:8px"><button type="button" class="btn ghost sm" data-act="vDel">${ic('trash',18)} حذف التسجيل</button><button type="button" class="btn ghost sm" data-act="vRe">${ic('mic',18)} إعادة التسجيل</button></div>`;
 const c=$('#vCanvas');
 v.blob.arrayBuffer().then(b=>new (window.AudioContext||window.webkitAudioContext)().decodeAudioData(b)).then(a=>{const d=a.getChannelData(0),n=64,step=Math.floor(d.length/n),vals=[];let mx=0;for(let i=0;i<n;i++){let m=0;for(let j=0;j<step;j+=16)m=Math.max(m,Math.abs(d[i*step+j]));vals.push(m);mx=Math.max(mx,m)}drawBars(c,vals.map(x=>x/(mx||1)));if(!v.dur){v.dur=a.duration;$('#vTimer').textContent=mmss(a.duration)}}).catch(()=>{});
}

 <form class="f" id="fPw" style="max-width:none"><label class="l"><span class="req">البريد الإلكتروني</span><input name="email" type="email" dir="ltr" autocomplete="email" autocapitalize="none" value="${esc(S.otpEmail||'')}"></label><label class="l"><span class="req">كلمة المرور</span><input name="pw" type="password" dir="ltr" autocomplete="current-password" minlength="6"></label><span class="hint">6 أحرف أو أرقام على الأقل.</span><div class="err" id="pwErr" role="alert"></div>

 <p class="hint" style="margin:0">نسيتِ كلمة المرور؟ تواصلي مع إدارة المدرسة لإعادة تعيينها.</p></form>`)}
const pwErr=m=>/invalid login|credentials/i.test(m)?'البريد أو كلمة المرور غير صحيحة.':/already|registered|exists/i.test(m)?'هذا البريد مسجّل مسبقًا؛ اضغطي «دخول» بكلمة المرور.':/password/i.test(m)?'كلمة المرور قصيرة؛ استخدمي 6 أحرف أو أرقام على الأقل.':/rate|seconds|too many/i.test(m)?'محاولات كثيرة؛ انتظري قليلًا ثم أعيدي المحاولة.':/confirm/i.test(m)?'الحساب يحتاج تأكيد البريد؛ تواصلي مع إدارة المنصة.':'تعذّر الدخول. تحقق من الاتصال وأعيدي المحاولة.';
async function pwAuth(mode){const f=$('#fPw'),e=$('#pwErr'),em=f.email.value.trim().toLowerCase(),pw=f.pw.value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return e.textContent='اكتب بريدًا إلكترونيًا صحيحًا.';if(pw.length<6)return e.textContent='كلمة المرور 6 أحرف أو أرقام على الأقل.';S.otpEmail=em;S.inLogin=true;$$('#fPw button').forEach(b=>b.disabled=true);
 try{const r=mode==='up'?await sb.auth.signUp({email:em,password:pw}):await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;
  if(!r.data.session){S.inLogin=false;$$('#fPw button').forEach(b=>b.disabled=false);return e.textContent='أُنشئ الحساب لكنه يحتاج تأكيد البريد. يجب تعطيل «Confirm email» في إعدادات Supabase.'}
  await afterLogin();S.inLogin=false;if(S.needSetup){closeModal();S.authUid=S.authUid||r.data.session.user.id;return render()}if(!S.user)return;closeModal();await sync();toast('مرحبًا، '+S.user.name);go(S.user.role==='parent'?'portal':S.user.role==='sysadmin'?'users':'admin')}
 catch(x){S.inLogin=false;$$('#fPw button').forEach(b=>b.disabled=false);e.textContent=pwErr(x?.message||'')}}
async function afterLogin(){
 const {data:{user}}=await sb.auth.getUser();if(!user){S.user=null;return}
 let p=null;try{p=(await q(sb.from('profiles').select('*').eq('id',user.id)))[0]}catch(e){}
 if(!p){S.user=null;S.authUid=user.id;if(!S.needSetup)profileModal();return}
 if(!p.active){await sb.auth.signOut();S.user=null;toast('الحساب غير نشط. تواصل مع إدارة المدرسة.');return}
 S.user={id:p.id,school:p.school_id,role:p.role,name:p.full_name,active:p.active};S.school=p.school_id;
}
function profileModal(){modal(`<span class="kicker">مرحبًا بك</span><h3>أكملي بياناتك</h3><p class="small">يُسجَّل حسابك أول مرة بدور «ولي الأمر». إن كنتِ من منسوبات المدرسة، تغيّر الإدارة دورك بعد التسجيل.</p><form class="f" id="fProfile" style="max-width:none"><label class="l"><span class="req">الاسم الكامل</span><input name="name" type="text" autocomplete="name"></label><div class="err" id="pfErr"></div><button class="btn" type="submit">حفظ والمتابعة</button></form>`)}
function setupView(){
 return `<section class="band"><div class="wrap" style="max-width:720px"><span class="kicker">التفعيل لأول مرة</span><h2>إنشاء المدرسة على المنصة</h2><p class="mut">قاعدة البيانات مرتبطة ولا توجد مدرسة بعد. من ينشئ المدرسة يصبح مديرتها على المنصة، ويمكنه لاحقًا إضافة المنسوبات وتعديل كل الإعدادات.</p>
 ${!S.authUid&&!S.user?`<div class="card"><p>الخطوة الأولى: سجّلي الدخول ببريدك الإلكتروني.</p><button class="btn" data-act="login">تسجيل الدخول</button></div>`:`<form class="f" id="fSetup" style="max-width:none"><fieldset><legend>بيانات المدرسة</legend><label class="l"><span class="req">اسم المدرسة</span><input name="school" type="text"></label><label class="l"><span class="req">اسمك الكامل</span><input name="name" type="text"></label><div class="err" id="suErr"></div><button class="btn gold" type="submit">إنشاء المدرسة وتفعيل المنصة</button></fieldset></form>`}</div></section>`;
}

/* --- إقلاع التشغيل الفعلي --- */
async function liveBoot(){
 $('#app').innerHTML='<section class="band"><div class="wrap"><p class="mut">جارٍ تحميل المنصة…</p></div></section>';
 if(!window.supabase?.createClient){$('#app').innerHTML='<section class="band"><div class="wrap"><div class="notice red">'+ic('alert')+'<div>تعذّر تحميل مكتبة الاتصال بقاعدة البيانات. تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.</div></div></div></section>';return}
 sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
 let schools=[];try{schools=await q(sb.from('public_schools').select('*'))}catch(e){console.error(e);$('#app').innerHTML='<section class="band"><div class="wrap"><div class="notice red">'+ic('alert')+'<div>تعذّر الاتصال بقاعدة البيانات. تأكدي من الرابط والمفتاح في إعدادات التفعيل، ومن تشغيل ملف schema.sql.</div></div></div></section>';return}
 const sc=schools.find(s=>s.id===CFG.SCHOOL_ID)||schools[0];
 S.needSetup=!sc;if(sc){DB.schools=[mapSchool(sc,null)];S.school=sc.id}
 const {data:{session}}=await sb.auth.getSession();
 if(session)await afterLogin();
 if(S.needSetup){render();bindAuth();return}
 await sync();render();bindAuth();
}
function bindAuth(){sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!S.user&&!S.inLogin){setTimeout(async()=>{await afterLogin();if(S.user){closeModal();await sync()}render()},0)}})}

  fInit:f=>{const e=$('#inErr');if(f.title.value.trim().length<4||f.desc.value.trim().length<10||!f.date.value)return e.textContent='يرجى تعبئة العنوان والوصف والموعد.';const pr=S.user.role==='principal';run(async()=>{await q(sb.from('initiatives').insert({school_id:S.school,title:f.title.value.trim(),category:f.cat.value,description:f.desc.value.trim(),starts_at:f.date.value,seats:Math.max(1,+f.seats.value||1),status:pr?'approved':'pending',created_by:S.user.id}));lnotify(pr?'parents':'principal',pr?'مبادرة جديدة: '+f.title.value.trim():'مبادرة بانتظار الاعتماد: '+f.title.value.trim())},pr?'نُشرت المبادرة':'أُرسلت للاعتماد')},
  fReg:f=>{const e=$('#rgErr');if(f.name.value.trim().length<3||f.nature.value.trim().length<4)return e.textContent='يرجى كتابة الاسم وطبيعة المشاركة.';const ev=f.evidence.value.trim();if(ev&&!/^https:\/\//.test(ev))return e.textContent='الرابط يجب أن يبدأ بـ https://';run(async()=>{await q(sb.from('registrations').insert({initiative_id:f.dataset.id,parent_id:S.user.id,display_name:f.name.value.trim(),nature:f.nature.value.trim(),beneficiaries:Math.max(0,+f.benef.value||0),evidence_url:ev||null,show_name:f.showName.checked}));lnotify('coordinator','تسجيل جديد في مبادرة');closeModal()},'تم تسجيلك بنجاح').then(r=>{if(!r)e.textContent='تعذّر التسجيل؛ ربما سجلت مسبقًا في هذه المبادرة.'})},
  fCouncil:f=>{const e=$('#cnErr'),k=f.kind.value,t=f.title.value.trim();if(t.length<5)return e.textContent='اكتب عنوانًا واضحًا.';const o=f.opts.value.split('\n').map(x=>x.trim()).filter(Boolean);if(k==='poll'&&o.length<2)return e.textContent='الاستطلاع يحتاج خيارين على الأقل.';run(async()=>{await q(sb.from('council_items').insert({school_id:S.school,kind:k,title:k==='idea'?'فكرة تصنع فرقًا: '+t:t,body:f.body.value.trim(),options:k==='poll'?o:null}));lnotify('parents','موضوع جديد في مجلس الأسرة: '+t)},'نُشر الموضوع')},
  fSB:f=>{const e=$('#sbErr'),t=f.title.value.trim();if(t.length<5)return e.textContent='اكتب عنوان الاستبيان.';const qs=S.sbQ.filter(x=>x.t.trim());if(!qs.length)return e.textContent='أضف سؤالًا واحدًا على الأقل.';if(qs.some(x=>x.k==='choice'&&x.o.split(/[،,]/).filter(y=>y.trim()).length<2))return e.textContent='أسئلة الاختيار تحتاج خيارين على الأقل.';const sc=SC();run(async()=>{await q(sb.from('surveys').insert({school_id:S.school,kind:f.kind.value,title:t,year:sc.year,term:+f.term.value,questions:qs.map((x,i)=>({id:'q'+(i+1),t:x.t.trim(),k:x.k,o:x.k==='choice'?x.o.split(/[،,]/).map(y=>y.trim()).filter(Boolean):undefined}))}));S.sbQ=[{t:'',k:'stars',o:''}];lnotify('parents','استبيان جديد: '+t)},'نُشر الاستبيان')},
  fNotify:f=>{const t=f.text.value.trim();if(t.length<5)return $('#ntErr').textContent='اكتب نص الإعلان.';run(()=>q(sb.from('notifications').insert({school_id:S.school,to_all_parents:true,body:t,ch_email:SC().integrations.email?'pending':'off',ch_whatsapp:SC().integrations.whatsapp?'pending':'off'})),'وصل الإعلان داخل المنصة. القنوات الخارجية لا تُرسل إلا بعد ربطها.')},
  fEv:f=>{const e=$('#evErr'),t=f.title.value.trim(),u=f.url.value.trim(),fl=$('#evFile').files[0];if(t.length<4)return e.textContent='اكتب عنوان الشاهد.';if(u&&!/^https:\/\//.test(u))return e.textContent='الرابط يجب أن يبدأ بـ https://';if(fl&&(!/^image\/(png|jpeg|webp)$|^application\/pdf$/.test(fl.type)||fl.size>8*1024*1024))return e.textContent='الملف يجب أن يكون صورة أو PDF حتى 8 ميجابايت.';if(!u&&!fl)return e.textContent='أرفق ملفًا أو رابطًا.';run(async()=>{const path=fl?await upMedia(fl,'evidence'):null;await q(sb.from('evidence').insert({school_id:S.school,initiative_id:f.init.value||null,title:t,kind:f.type.value,url:u||null,storage_path:path,approved:S.user.role==='principal',created_by:S.user.id}))},'أضيف الشاهد')},
  fStory:f=>{const e=$('#stErr'),s=findSub(f.dataset.id);if(f.need.value.trim().length<5||f.action.value.trim().length<5||f.result.value.trim().length<5)return e.textContent='يرجى تعبئة الحقول المطلوبة.';const ph=$('#stPhoto').files[0];run(async()=>{const path=ph&&/^image\//.test(ph.type)?await upMedia(ph,'stories'):null;await q(sb.from('impact_stories').insert({school_id:S.school,submission_id:s.id,title:s.title,need:f.need.value.trim(),action:f.action.value.trim(),done_on:(s.closedAt||nowISO()).slice(0,10),beneficiaries:Math.max(0,+f.benef.value||0),result:f.result.value.trim(),thanks_text:f.consent.checked&&s.name?'شكرًا لصاحبة/صاحب المقترح: '+s.name:'شكرًا لصاحب المقترح على فكرته الملهمة',name_consent:f.consent.checked,photo_paths:path?[pubUrl(path)]:[],published:true}));if(s.parent)lnotify(s.parent,`نُشر مقترحك «${s.title}» في معرض «من صوت إلى أثر». شكرًا لشراكتك!`);closeModal()},'نُشرت البطاقة').then(r=>r&&go('impact'))},
  fSet:f=>{const u=f.publicUrl.value.trim();if(u&&!/^https:\/\/[^\s]+\.[^\s]+/.test(u))return toast('رابط المنصة يجب أن يبدأ بـ https://');const lg=$('#logoFile').files[0];if(lg&&(!/^image\//.test(lg.type)||lg.size>1024*1024))return toast('الشعار يجب أن يكون صورة حتى 1 ميجابايت');const terms=+f.terms.value;
   run(async()=>{const row={name:f.name.value.trim(),office:f.office.value.trim(),stage:f.stage.value,kind:f.kind.value.trim(),principal_name:f.principal.value.trim(),coordinator_name:f.coordinator.value.trim(),phone:f.phone.value.trim(),email:f.email.value.trim(),work_hours:f.hours.value.trim(),public_url:u||null,current_year:+f.year.value,terms,current_term:Math.min(+f.term.value,terms),target_families:Math.max(1,+f.targetFamilies.value||1),reopen_days:Math.max(0,+f.reopenDays.value||0),retention_years:Math.max(1,+f.retention.value||1),int_email:f.int_email.checked,int_whatsapp:f.int_whatsapp.checked};if(lg)row.logo_path=pubUrl(await upMedia(lg,'logo'));await q(sb.from('schools').update(row).eq('id',S.school));laudit('تعديل إعدادات المدرسة','')},'حُفظت الإعدادات')},
  fUser:()=>toast('تُضاف المنسوبة بدخولها المنصة أول مرة ببريدها، ثم يُغيَّر دورها هنا.'),
  fSchool:()=>{}
 });
 const ch=async e=>{const t=e.target;
  if(t.dataset.dr){e.stopImmediatePropagation();run(()=>q(sb.from('data_requests').update({status:t.value}).eq('id',t.dataset.dr)),'حُدّثت حالة الطلب')}
  if(t.dataset.urole){e.stopImmediatePropagation();run(()=>q(sb.from('profiles').update({role:t.value}).eq('id',t.dataset.urole)),'حُدّث الدور')}
  if(t.dataset.uact){e.stopImmediatePropagation();run(()=>q(sb.from('profiles').update({active:t.checked}).eq('id',t.dataset.uact)),t.checked?'فُعّل الحساب':'عُطّل الحساب')}};
 document.addEventListener('change',ch,true);
 liveBoot();
}
function mapTrack(d){return{id:d.id,school:S.school,ref:d.ref,title:d.title,type:d.type,domain:d.domain,status:d.status,createdAt:d.created_at,updatedAt:d.updated_at,closedAt:d.closed_at,rating:d.rating,ratingNote:d.rating_note||'',reopened:d.reopened||0,dueDays:5,history:(d.history||[]).map(h=>({st:h.status,at:h.at,note:h.note})),replies:(d.replies||[]).map(r=>({id:r.id,by:r.by,text:r.body,public:true,at:r.at})),attachments:[],notes:[]}}
async function retrack(){if(!S.trackObj)return;try{const d=await q(sb.rpc('track_submission',{p_ref:S.trackObj.ref,p_pin:S.trackPin}));if(d)S.trackObj=mapTrack(d);render(1)}catch(e){}}

}
